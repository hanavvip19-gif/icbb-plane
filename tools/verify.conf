# Dibaca tools/verify-changed.sh untuk verifikasi deterministik fork Plane ICBB.
verify_unit "metadata-and-hygiene" '.*' '
  export PATH="/home/usman/.npm-global/bin:$PATH"
  git diff --check &&
  test -f AGENTS.md && test ! -L AGENTS.md &&
  test -L CLAUDE.md && test "$(readlink CLAUDE.md)" = "PROJECT_CONTEXT.md" &&
  python3 -m json.tool .ai/repository.json >/dev/null &&
  python3 -m json.tool .ai/verification-profile.json >/dev/null &&
  python3 -m json.tool .generated/REPO_MAP.json >/dev/null
'

verify_unit "propel-and-constants" '^packages/(propel|constants)/' '
  export PATH="/home/usman/.npm-global/bin:$PATH"
  pnpm --filter @plane/constants check:types &&
  pnpm --filter @plane/propel check:types &&
  pnpm --filter @plane/propel build
'

verify_unit "i18n" '^packages/i18n/' '
  export PATH="/home/usman/.npm-global/bin:$PATH"
  python3 -c "import glob, json; [json.load(open(p)) for p in glob.glob(\"packages/i18n/src/locales/*/*.json\")]" &&
  pnpm --filter @plane/i18n build
'

verify_unit "web-types" '^(apps/web/|packages/(propel|constants|i18n)/)' '
  export PATH="/home/usman/.npm-global/bin:$PATH"
  pnpm --filter web check:types
'

verify_unit "space-types" '^(apps/space/|packages/(propel|constants)/)' '
  export PATH="/home/usman/.npm-global/bin:$PATH"
  pnpm --filter space check:types
'
